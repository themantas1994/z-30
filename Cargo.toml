[workspace]
resolver = "2"
members = ["crates/*"]
# The audit's language proof-of-concept is its own throwaway crate; it is evidence, not product.
exclude = ["audit"]

[workspace.package]
# The first release is `v0.1.0-experimental`. Nothing was ever published under the development
# 0.9.0 the workspace carried - there is no tag and no release - and a binary must not report a
# version no release ever carried, so the series starts here. The release workflow refuses a tag
# that is not `v` + this string, so the archive names, `--version` and the tag cannot disagree.
version = "0.1.0-experimental"
edition = "2021"
license = "MIT"
repository = "https://github.com/themantas1994/z-30"
# The oldest toolchain the WHOLE workspace builds with, checked in CI (.github/workflows/rust.yml,
# "msrv" job). It was declared 1.82 while z30-gui's eframe 0.36 needs 1.95, so the declared
# version could not build the workspace (2026-09-24 audit, H-08).
rust-version = "1.95"

[workspace.dependencies]
z30-protocol = { path = "crates/z30-protocol" }
z30-dsp = { path = "crates/z30-dsp" }
z30-channel = { path = "crates/z30-channel" }
z30-engine = { path = "crates/z30-engine" }
z30-io = { path = "crates/z30-io" }
libm = "0.2"
rustfft = "6"
realfft = "3"
rayon = "1"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.8"
crossbeam-channel = "0.5"
arc-swap = "1"
rtrb = "0.4"
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

# Tests run the DSP on real frame sizes; unoptimised they take minutes instead of seconds.
[profile.test]
opt-level = 3

# Dependencies are optimised (the DSP tests run real frame sizes) but carry no debug info: nobody
# steps through rustfft or eframe, and it cost 14 % of a clean `cargo test` build (mean 444 s against
# 518 s, two runs each) and 30 % of target/ (4.0 GB against 5.7 GB) on 4 cores
# (audit/2026-10-06-codebase-cleanup/FINAL_REPORT.md). The workspace's own crates keep full
# debug info; the release profile is unchanged.
[profile.dev.package."*"]
opt-level = 3
debug = false
