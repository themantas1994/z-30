name: Release

# Release artefacts of the production application: the `z30` command-line station and the
# `z30-gui` desktop application, built from the tagged commit, with CM108 GPIO PTT included.
#
# Each archive contains exactly: the two binaries, README.md, LICENSE, INSTALL.md and
# BUILDINFO.txt (the binaries' own `--version` output). No Python, no Node, no browser bundle,
# no other runtime - checked below, so a release cannot quietly carry the retired runtime the way
# the Python wheel carried a 63-commit-stale web bundle (2026-09-24 audit, C-04).
#
# Nothing here claims hardware validation: see docs/hardware.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
          - { os: macos-14, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: macos-13, target: x86_64-apple-darwin, archive: tar.gz }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Reproducible build date (the commit's time)
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Test on this platform first
        run: cargo test --workspace --exclude z30-py --release --locked
      - name: Build the release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} -p z30-cli -p z30-gui --features z30-cli/cm108,z30-gui/cm108
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          bin=target/${{ matrix.target }}/release
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          name="z30-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "$bin/z30$ext" "$bin/z30-gui$ext" README.md LICENSE "dist/$name/"
          cp docs/install.md "dist/$name/INSTALL.md"
          { "$bin/z30$ext" --version; echo; "$bin/z30-gui$ext" --version; } > "dist/$name/BUILDINFO.txt"
          cat "dist/$name/BUILDINFO.txt"
          # The artefact is the commit it claims to be, built clean, with CM108.
          short=$(git rev-parse --short=12 HEAD)
          grep -q "$short" "dist/$name/BUILDINFO.txt"
          ! grep -q dirty "dist/$name/BUILDINFO.txt"
          grep -q "features:     cm108" "dist/$name/BUILDINFO.txt"
          # Exactly these files and nothing else.
          expected="BUILDINFO.txt INSTALL.md LICENSE README.md z30$ext z30-gui$ext"
          actual=$(ls "dist/$name" | sort | tr '\n' ' ' | sed 's/ $//')
          [ "$actual" = "$(echo $expected | tr ' ' '\n' | sort | tr '\n' ' ' | sed 's/ $//')" ] || { echo "unexpected contents: $actual"; exit 1; }
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then 7z a "$name.zip" "$name" > /dev/null; else tar czf "$name.tar.gz" "$name"; fi
          echo "ARCHIVE=dist/$name.${{ matrix.archive }}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artefacts
          merge-multiple: true
      - name: Checksums
        run: cd artefacts && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artefacts/* \
            --title "z-30 $GITHUB_REF_NAME (vNext)" \
            --notes "z-30 vNext release built from $(git rev-parse HEAD). Protocol and software validated in simulation; NOT yet validated on real radio hardware or on the air - see docs/hardware.md before transmitting." \
            --prerelease
