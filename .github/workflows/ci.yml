name: CI

# Reference code and repository hygiene. The production application (the Rust workspace in
# crates/) is built, tested and benchmarked by rust.yml; this workflow covers what surrounds it:
#
# - the frozen Python protocol oracle (legacy/python-oracle), which generates the golden vectors
#   the Rust code is tested against;
# - the retired browser runtime's reference tests (legacy/browser-runtime), kept because its
#   TypeScript codec is the reference for whole-message packing;
# - the separation itself: no legacy runtime, bundle or installer may reappear in the
#   production path (2026-09-24 audit, C-04 and section 5 of the remediation brief).

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN, set once at workflow level so every job inherits it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle:
    name: Python oracle (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Exactly the versions legacy/python-oracle/pyproject.toml declares (>=3.10): the pinned
        # NumPy 2.2 / SciPy 1.15 need 3.10. The old CI tested 3.10/3.12/3.13 against a declared
        # floor of 3.9 (2026-09-24 audit, L-04).
        python-version: ['3.10', '3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: legacy/python-oracle
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: legacy/python-oracle/requirements.txt
      - name: Install the pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest 'ruff==0.16.5'
      - name: Lint
        run: ruff check z30_dsp tests
      - name: Oracle test suite (includes the freeze check)
        run: python -m pytest tests -q
      - name: The oracle reference benchmark stays reproducible across runs and worker counts
        # A short seeded sweep straddling the threshold, so the dithered fourth schedule runs.
        run: |
          python - <<'PY'
          from z30_dsp.benchmark import run_monte_carlo_snr_sweep

          def curve(rows):
              return [{k: v for k, v in r.items() if k not in ("elapsed_sec", "workers")} for r in rows]

          for mode in ("ideal", "realistic"):
              kwargs = dict(min_snr_db=-27, max_snr_db=-25, step_snr_db=2, frames_per_snr=3,
                            mode=mode, fading="none", seed=1)
              a = run_monte_carlo_snr_sweep(**kwargs)
              b = run_monte_carlo_snr_sweep(**kwargs)
              c = run_monte_carlo_snr_sweep(workers=2, **kwargs)
              assert curve(a) == curve(b) == curve(c), mode
              assert a[0]["avg_iters"] > 100, "the sweep no longer reaches the later schedules"
              print(f"{mode}: reproducible serially and on 2 workers")
          PY

  legacy-browser:
    name: Retired browser runtime (reference tests only)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy/browser-runtime
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: legacy/browser-runtime/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Reference tests (codec vectors, transmit-gate regressions, determinism)
        run: npm run test:ts
      - name: It is not buildable as an application
        run: |
          set -e
          node -e 'const s=require("./package.json").scripts; for (const k of ["dev","build","preview","start"]) if (s[k]) { console.error("script " + k + " reintroduced"); process.exit(1) }'
          echo "no dev/build/preview/start script"

  dependency-audit:
    name: Dependency audit (oracle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --requirement legacy/python-oracle/requirements.txt --strict

  hygiene:
    name: Repository hygiene and production separation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: LICENSE file must exist
        run: test -f LICENSE && grep -q 'MIT License' LICENSE

      - name: No build artifacts or bytecode may be committed
        run: |
          set -e
          if git ls-files | grep -E '(^|/)__pycache__/|\.pyc$|(^|/)dist/|(^|/)target/|(^|/)node_modules/'; then
            echo "Build artifacts are tracked in git; remove them and rely on .gitignore."
            exit 1
          fi

      - name: No stale web bundle, no legacy launcher, no installer of the retired runtime
        # The committed web_dist/ bundle was 63 commits stale and defaulted to the real callsign
        # W1AW (audit C-04); the launcher fell back to Tk and then to a benchmark (L-01); the
        # installers installed a runtime that did not receive (C-01). None may come back.
        run: |
          set -e
          bad=$(git ls-files | grep -E '(^|/)web_dist/|(^|/)web_server\.py$|(^|/)rf_time_sync\.py$|(^|/)gui_tkinter\.py$|^z30_dsp/|^src/|^pyproject\.toml$|^package\.json$|^install_[a-z_]+\.sh$|^run_windows\.bat$|^PKGBUILD$|^z30\.spec$' || true)
          if [ -n "$bad" ]; then echo "retired runtime files are back in the production tree:"; echo "$bad"; exit 1; fi
          echo "production tree is Rust-only"

      - name: One lockfile per package manager, in the places that own them
        run: |
          set -e
          test "$(git ls-files | grep -cE '(^|/)(bun\.lockb?|yarn\.lock|pnpm-lock\.yaml)$' || true)" -eq 0
          test "$(git ls-files | grep -cE '(^|/)package-lock\.json$')" -eq 1
          git ls-files | grep -qx 'legacy/browser-runtime/package-lock.json'
          git ls-files | grep -qx 'Cargo.lock'
