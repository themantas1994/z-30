name: CI

# Repository hygiene, dependency advisories and the research tools. The application (the Rust
# workspace in crates/) is built, tested and benchmarked by rust.yml.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN, set once at workflow level so every job inherits it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-advisories:
    # The shipped binaries bundle SQLite, hidapi, cpal and eframe (2026-09-28 audit F-50 /
    # CTO-13). This scans Cargo.lock against the RustSec database and fails on any vulnerability.
    name: Dependency audit (Rust, Cargo.lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - name: cargo audit
        # Vulnerabilities fail the job; informational warnings (unmaintained, yanked) are printed.
        # The two pyo3 ignores (RUSTSEC-2026-0176/-0177) went with crates/z30-py, the only crate
        # that used it (2026-10-06 cleanup).
        run: cargo audit

  hygiene:
    name: Repository hygiene and production separation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: LICENSE file must exist
        run: test -f LICENSE && grep -q 'MIT License' LICENSE

      - name: No build artifacts or bytecode may be committed
        run: |
          set -e
          if git ls-files | grep -E '(^|/)__pycache__/|\.pyc$|(^|/)dist/|(^|/)target/|(^|/)node_modules/'; then
            echo "Build artifacts are tracked in git; remove them and rely on .gitignore."
            exit 1
          fi

      - name: No stale web bundle, no legacy launcher, no installer of the retired runtime
        # The committed web_dist/ bundle was 63 commits stale and defaulted to the real callsign
        # W1AW (audit C-04); the launcher fell back to Tk and then to a benchmark (L-01); the
        # installers installed a runtime that did not receive (C-01). None may come back.
        run: |
          set -e
          bad=$(git ls-files | grep -E '(^|/)web_dist/|(^|/)web_server\.py$|(^|/)rf_time_sync\.py$|(^|/)gui_tkinter\.py$|^z30_dsp/|^src/|^pyproject\.toml$|^package\.json$|^install_[a-z_]+\.sh$|^run_windows\.bat$|^PKGBUILD$|^z30\.spec$' || true)
          if [ -n "$bad" ]; then echo "retired runtime files are back in the production tree:"; echo "$bad"; exit 1; fi
          echo "production tree is Rust-only"

      - name: No retired implementation stack comes back
        # The Python oracle, the browser runtime and the PyO3 bindings were deleted in the
        # 2026-10-06 cleanup (audit/2026-10-06-codebase-cleanup/). Rust is the only
        # implementation; the Python left is the stdlib-only research tools and audit evidence.
        run: |
          set -e
          bad=$(git ls-files | grep -E '^legacy/|^crates/z30-py/|^reference/|(^|/)(package(-lock)?\.json|bun\.lockb?|yarn\.lock|pnpm-lock\.yaml|requirements[^/]*\.txt|pyproject\.toml|setup\.py)$' || true)
          if [ -n "$bad" ]; then echo "a retired stack is back:"; echo "$bad"; exit 1; fi
          py=$(git ls-files '*.py' | grep -vE '^(research|audit)/' || true)
          if [ -n "$py" ]; then echo "Python outside research/ and audit/:"; echo "$py"; exit 1; fi
          if git ls-files | grep -E '\.(ts|tsx|mts|js|mjs|jsx)$' | grep -v '^audit/'; then echo "JS/TS outside audit/"; exit 1; fi
          test "$(git ls-files '*Cargo.lock' | grep -v '^audit/')" = "Cargo.lock"

      - name: The golden fixtures are frozen
        # Their generators (the Python oracle and the TypeScript codec) are gone, so the
        # fixtures can no longer be regenerated, only kept. Any byte that changes fails here.
        run: cd fixtures/golden && sha256sum --check --strict FROZEN.sha256 && test "$(ls | wc -l)" -eq 20

      - name: No unpublished suite result is committed as if it were the record
        # z30 writes exploratory and dirty-build results under these two trees by default
        # (audit 2026-09-28 F-13 / F-14); they are git-ignored and must stay out of the history.
        run: |
          set -e
          if git ls-files | grep -E '^research/results/(exploratory|unpublished)/'; then
            echo "unpublished results are tracked"; exit 1
          fi

  research-tools:
    name: Research tools fail closed (summarise, compare, pair)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      # Standard library + pytest only; includes the byte-for-byte regeneration of the
      # published 672cef9b3cdb/SUMMARY.md.
      - run: python -m pytest research/tests -q
