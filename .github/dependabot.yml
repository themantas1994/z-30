# Dependency update automation.
#
# Grouped and monthly rather than per-package and weekly: a DSP dependency bump has to be
# reviewed against the golden vectors and the benchmark suite, so a stream of single-package PRs
# would be ignored, which is worse than none.
#
# The retired browser runtime (legacy/browser-runtime) is deliberately not listed: it is a frozen
# reference that is not built or shipped, and keeping its dependency tree moving would only
# produce churn in code nobody runs.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      rust:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "pip"
    directory: "/legacy/python-oracle"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      python-oracle:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"
