# Dependency update automation.
#
# Grouped and monthly rather than per-package and weekly: a DSP dependency bump has to be
# reviewed against the golden vectors and the benchmark suite, so a stream of single-package PRs
# would be ignored, which is worse than none.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      rust:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"
