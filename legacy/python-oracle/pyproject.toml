# The frozen Python protocol oracle of z-30. NOT the z-30 application: it has no entry points,
# opens no audio device, keys no transmitter and serves nothing. See README.md in this directory.
# The z-30 application is the Rust workspace in crates/ (the `z30` and `z30-gui` binaries).

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "z30-oracle"
version = "1.0.0"
description = "Frozen reference implementation of the z-30 v1 protocol and its reference receiver, for golden vectors and research. Not production software."
readme = "README.md"
license = { text = "MIT" }
# The pinned requirements.txt (NumPy 2.2, SciPy 1.15) needs 3.10; CI tests 3.10-3.13, and the
# declared floor now says the same thing CI tests (2026-09-24 audit, L-04).
requires-python = ">=3.10"
dependencies = ["numpy>=1.22.0", "scipy>=1.8.0"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Science/Research",
    "Topic :: Communications :: Ham Radio",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Deliberately no [project.scripts]: nothing here is an application.

[tool.setuptools]
packages = ["z30_dsp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Pinned for the reason the old root pyproject gave: a check whose meaning changes when the tool
# releases is not a check (ruff 0.16 widened its defaults and turned a clean tree into 408
# findings). UP006/UP035 are not selected because following them would break annotations on
# older interpreters without `from __future__ import annotations`.
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
