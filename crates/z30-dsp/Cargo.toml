[package]
name = "z30-dsp"
description = "z-30 receiver: resampler, Costas-array acquisition, fine dt/f/drift sync, non-coherent Log-MAP demodulator, LDPC cascade, AP, least-squares SIC, decode_slot. Pure: no I/O."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
z30-protocol.workspace = true
rustfft.workspace = true
realfft.workspace = true
# Candidates within one SIC pass decode on a rayon pool; the report is bit-identical at any
# thread count (the per-candidate work is a pure function of its input; sic_regression.rs).
rayon.workspace = true

[dev-dependencies]
z30-channel.workspace = true
rand.workspace = true
serde_json.workspace = true
