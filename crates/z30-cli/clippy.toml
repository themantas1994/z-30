# What the SOFTWARE loopback (`src/loopback.rs`) may never reach, enforced by name resolution:
# that file carries `#![forbid(clippy::disallowed_methods, clippy::disallowed_types)]`, and CI runs
# clippy with `-D warnings` on every platform. The rest of the crate allows these (main.rs writes
# files; the station opens devices). Resolved names cannot be hidden by aliases, globs, macros or
# trait dispatch, which got round four syntax-level guards in a row (transmit-safety 02c-02f).
# It sees only calls made in loopback.rs itself, so it is one of two required layers, not the
# guarantee alone: tests/loopback_isolation.rs holds the file to an allowlist of what it may name
# (which is what refuses this crate's other functions and every z30_io item), and pins this list,
# the forbid and the absence of any other clippy configuration (02g). FFI is refused by
# `forbid(unsafe_code)` in loopback.rs. Paths that exist only on one platform or with a feature are
# `allow-invalid`.

disallowed-types = [
  { path = "std::net::TcpStream", reason = "rigctld: `T 1` keys a CAT radio" },
  { path = "std::net::TcpListener", reason = "network" },
  { path = "std::net::UdpSocket", reason = "network" },
  { path = "std::fs::File", reason = "opening a tty asserts DTR/RTS (serial PTT)" },
  { path = "std::fs::OpenOptions", reason = "opening a tty asserts DTR/RTS (serial PTT)" },
  { path = "std::fs::DirBuilder", reason = "file system" },
  { path = "std::process::Command", reason = "rigctl, aplay" },
  { path = "std::process::Child", reason = "processes" },
  { path = "std::os::unix::net::UnixStream", reason = "sockets", allow-invalid = true },
  { path = "std::os::unix::net::UnixListener", reason = "sockets", allow-invalid = true },
  { path = "std::os::unix::net::UnixDatagram", reason = "sockets", allow-invalid = true },
  { path = "z30_io::audio::CpalOutput", reason = "audio output: a VOX radio transmits it" },
  { path = "z30_io::audio::CpalInput", reason = "audio device" },
  { path = "z30_io::serial_ptt::SerialPtt", reason = "PTT" },
  { path = "z30_io::rigctld::Rigctld", reason = "rig control" },
  { path = "z30_io::rigctld::RigctldPtt", reason = "PTT" },
  { path = "z30_io::cm108::Cm108Ptt", reason = "PTT", allow-invalid = true },
  { path = "z30_engine::ptt::PttController", reason = "PTT" },
  { path = "z30_engine::ptt::VoxPtt", reason = "PTT" },
  { path = "z30_engine::runtime::RuntimeParts", reason = "the live runtime" },
  { path = "z30_io::logbook::Logbook", reason = "opens a path the caller names" },
]

disallowed-methods = [
