  { path = "std::fs::copy", reason = "file system" },
  { path = "std::fs::hard_link", reason = "file system" },
  { path = "std::fs::metadata", reason = "file system" },
  { path = "std::fs::symlink_metadata", reason = "file system" },
  { path = "std::fs::canonicalize", reason = "file system" },
  { path = "std::fs::read_link", reason = "file system" },
  { path = "std::fs::set_permissions", reason = "file system" },
