[package]
name = "z30-cli"
description = "z-30 headless command line: receive, decode recordings, capture slots, benchmark, diagnostics, migration."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "z30"
path = "src/main.rs"

[dependencies]
z30-protocol.workspace = true
z30-dsp.workspace = true
z30-channel.workspace = true
z30-engine.workspace = true
z30-io.workspace = true
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
serde_json.workspace = true
crossbeam-channel.workspace = true
rayon.workspace = true
rand.workspace = true
rustfft.workspace = true

[features]
cm108 = ["z30-io/cm108"]

[dev-dependencies]
# The loopback-isolation guard parses src/loopback.rs as Rust (tests/loopback_isolation.rs):
# text matching was bypassed by literals, spacing, aliases and macros (transmit-safety 02c, 02d).
syn = { version = "2.0.119", default-features = false, features = ["full", "visit", "parsing", "printing", "proc-macro"] }
proc-macro2 = "1.0.107"
