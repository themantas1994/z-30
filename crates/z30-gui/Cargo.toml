[package]
name = "z30-gui"
description = "z-30 desktop GUI (egui/eframe). Renders EngineSnapshot and sends Commands; owns no radio state, runs no DSP."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.95"

[[bin]]
name = "z30-gui"
path = "src/main.rs"

[dependencies]
z30-protocol.workspace = true
z30-dsp.workspace = true
z30-engine.workspace = true
z30-io.workspace = true
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
crossbeam-channel.workspace = true
arc-swap.workspace = true
# SIGINT/SIGTERM/SIGHUP (Unix) and console close (Windows) -> release PTT before exiting.
ctrlc = { version = "3", features = ["termination"] }

[features]
cm108 = ["z30-io/cm108"]
